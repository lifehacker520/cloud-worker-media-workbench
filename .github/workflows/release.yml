name: Release desktop client

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci
      - name: Install Windows x86 native dependency
        if: matrix.args == '--win'
        shell: bash
        run: |
          sharp_version="$(node -p "require('./node_modules/sharp/package.json').version")"
          npm install --force --no-save --package-lock=false --ignore-scripts \
            "@img/sharp-win32-ia32@$sharp_version" \
            "@img/sharp-win32-x64@$sharp_version"
      - name: Smoke test macOS media worker
        if: matrix.args == '--mac'
        shell: bash
        env:
          CLOUD_WORKER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$CLOUD_WORKER_PYTHON" --version
          port=38765
          "$CLOUD_WORKER_PYTHON" tools/media-model-worker/app.py --port "$port" > media-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true; cat media-worker.log' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:$port/health"; then
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 0.2
          done
          exit 1
      - name: Run tests
        env:
          CLOUD_WORKER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm test
      - name: Verify release version
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Build installer
        run: npm run dist -- ${{ matrix.args }} --publish never
      - name: Verify Windows installers
        if: matrix.args == '--win'
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -type f -name '*-win-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*-win-ia32.exe' -print -quit)"
      - name: Verify macOS app bundle signature
        if: matrix.args == '--mac'
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify release files
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print | sort
          test -f release/latest-mac.yml
          test -f release/latest.yml
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*-win-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*-win-ia32.exe' -print -quit)"
          grep -q 'win-x64.exe' release/latest.yml
          grep -q 'win-ia32.exe' release/latest.yml
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "云员工媒体工作台 $RELEASE_TAG" \
            --generate-notes
